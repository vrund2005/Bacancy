<!-- 1) Create an HTML file with a paragraph <p id="secret-message">Initial Text</p> and a button. -->

<!-- 2) Create three <div> elements with the class box.
Select all boxes using querySelectorAll and change the background color of each box to lightblue using forEach. -->

<!-- 3) Create a button with text "Clicks: 0".
Initialize a variable count = 0.
On each button click, increment count and update the button text accordingly. -->

<!-- 4) Create a <div> with a black border and white background.
Define a CSS class .active that changes the background to green and text color to white.
On click, toggle the .active class using classList.toggle(). -->

<!-- 5) Write a function downloadFile(url, callback) that simulates a 3-second delay using setTimeout.
After the delay, log "Download complete: [url]" and execute the callback function. -->

<!-- 6) Create three functions step1, step2, and step3, each accepting a callback and completing after 1 second using setTimeout.
Call them in sequence using nested callbacks.
Log "All steps finished" only after step3 completes. -->

<!-- 7) Create a function tossCoin() that returns a Promise.
Resolve with "Heads" if a random number is greater than 0.5, otherwise reject with "Tails".
Consume the promise using .then() and .catch(). -->

<!-- 8) Create a Promise that resolves with the number 5.
Chain .then() to double the number, then another .then() to add 20, and finally log the result. -->

<!-- 9) Create a function wait(ms) that returns a Promise and resolves after ms milliseconds using setTimeout.
Use it to log "2 seconds passed" after 2000 ms. -->

<!-- 10) Create a function simulateTask(name, delay) that returns a Promise resolving after delay ms.
Part A: Run three tasks sequentially using async/await.
Part B: Run three tasks simultaneously using Promise.all().
Compare the total time taken for Part A vs Part B. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigment of DOM</title>
    <style>
        .que-2 {
            display: flex;
            gap: 50px;
            padding: 50px;
            text-align: center;
            justify-content: center;
        }

        .box {
            width: 50px;
            height: 25px;
            background-color: aquamarine;
        }
    </style>
</head>

<body>

    <div class="que-1">
        <p id="secret-message">Initial Text</p>
        <button id="secret-btn">Reveal Secret</button>

        <script>
            const btn = document.getElementById('secret-btn');
            const para = document.getElementById('secret-message')

            btn.addEventListener("click", () => {
                para.innerHTML = "You found the secret message"
            })
        </script>
    </div>

    <div class="que-2">
        <div class="box">box 1</div>
        <div class="box">box 2</div>
        <div class="box">box 3</div>

        <script>
            const boxes = document.querySelectorAll(".box");
            boxes.forEach((x) => {
                x.style.backgroundColor = "red"
            })
        </script>
    </div>

    <div class="que-3">
        <p>Clicks : <span id="cnt">0</span></p>
        <button id="cnt-btn">Click me</button>

        <script>
            const cnt_btn = document.getElementById("cnt-btn");
            let count = document.getElementById("cnt");
            let counter = 1;
            cnt_btn.addEventListener("click", () => {
                count.textContent = `${counter}`;
                counter++;
            })
        </script>
    </div>

    <div class="que-4">
        <style>
            .bnw {
                width: 100px;
                height: 100px;
                border: 2px solid black;
                background-color: white;
                cursor: pointer;
                color: black;
            }
            .active {
                background-color: green;
                color: white;
            }
        </style>
        <div class="bnw">click me</div>
        <script>
            const bnw = document.querySelector('.bnw');
            bnw.addEventListener("click", () => {
                bnw.classList.toggle("active")
            })
        </script>
    </div>

    <div class="que-5">
        <script>
            function downloadFile(url, callback) {
                setTimeout(() => {
                    console.log("File Downloaded")
                    callback()
                }, 3000);
            }
            downloadFile("url.com", () => {
                console.log("Opening the file...")
            })
        </script>
    </div>

    <div class="que-6">
        <script>
            function step1(callbak) {
                setTimeout(() => {
                    console.log("Step 1 completed")
                    callbak()
                }, 1000);
            }
            function step2(callback) {
                setTimeout(() => {
                    console.log("Step 2 completed")
                    callback()
                }, 1000);
            }
            function step3(callback) {
                setTimeout(() => {
                    console.log("Step 3 completed")
                    callback()
                }, 1000);
            }
            step1(() => {
                step2(() => {
                    step3(() => {
                        console.log("All steps finished")
                    })
                })
            })
        </script>
    </div>

    <div class="que-7">
        <script>
            function tossCoin() {
                return new Promise((resolve, reject) => {
                    const randomNo = Math.random();
                    if (randomNo > 0.5) {
                        resolve("Heads")
                    } else {
                        reject("Tails")
                    }
                })
            }
            tossCoin()
                .then((result) => {
                    console.log(result)
                })
                .catch((error) => {
                    console.log(error)
                }) 
        </script>
    </div>

    <div class="que-8">
        <script>
            Promise.resolve(5)
                .then(no => no * 2)
                .then(no => no + 20)
                .then(result => console.log(result));
        </script>
    </div>

    <div class="que-9">
        <script>
            function wait(ms) {
                return new Promise(res =>
                    setTimeout(() => res(`${ms} ms passed`), ms)
                );
            }
            wait(5000).then((msg) => console.log(msg))
        </script>
    </div>

    <div class="que-10">
        <script>
            function simulateTask(name, delay) {
                return new Promise(res =>
                    setTimeout(() => res(`${name} completed`), delay)
                )
            }
            simulateTask("Task 1", 5000).then((msg) => console.log(msg));

            async function runSequential() {
                console.time("Sequential");
                await simulateTask("Task 1", 1000);
                await simulateTask("Task 2", 1000);
                await simulateTask("Task 3", 1000);
                console.timeEnd("Sequential");
            }
            runSequential();

            async function runParallel() {
                console.time("Parallel");
                await Promise.all([
                    simulateTask("Task 1", 1000),
                    simulateTask("Task 2", 1000),
                    simulateTask("Task 3", 1000)
                ]);
                console.timeEnd("Parallel");
            }
            runParallel();
        </script>
    </div>
</body>
</html>
