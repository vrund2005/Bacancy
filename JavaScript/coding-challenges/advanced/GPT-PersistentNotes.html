<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        .input {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        input, textarea {
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .note {
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .note h3 {
            margin: 0 0 8px 0;
        }

        .note-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        #message {
            height: 20px;
            font-size: 14px;
            color: #dc2626;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Your Notes</h1>

    <div id="message"></div>

    <ul id="notes-list"></ul>

    <h2>Add New Note</h2>

    <div class="input">
        <input type="text" id="title" placeholder="Enter title">
        <textarea id="note-input" placeholder="Enter your note"></textarea>
        <button id="add-note" class="primary-btn">Add Note</button>
    </div>
</div>

<script>
    const STORAGE_KEY = "notesAppData";

    const notesList = document.getElementById("notes-list");
    const titleInput = document.getElementById("title");
    const noteInput = document.getElementById("note-input");
    const addNoteBtn = document.getElementById("add-note");
    const message = document.getElementById("message");

    let notes = [];

    function loadNotes() {
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (!stored) {
                notes = [];
                return;
            }

            const parsed = JSON.parse(stored);

            if (!Array.isArray(parsed)) {
                notes = [];
                return;
            }

            notes = parsed;
        } catch (error) {
            console.error("Corrupt storage detected. Resetting.");
            notes = [];
        }
    }

    function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function showMessage(text, isError = true) {
        message.style.color = isError ? "#dc2626" : "green";
        message.textContent = text;

        setTimeout(() => {
            message.textContent = "";
        }, 2000);
    }

    function renderNotes() {
        notesList.innerHTML = "";

        notes.forEach(note => {
            const li = document.createElement("li");
            li.className = "note";

            const title = document.createElement("h3");
            title.textContent = note.title;

            const content = document.createElement("p");
            content.textContent = note.content;

            const actions = document.createElement("div");
            actions.className = "note-actions";

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete-btn";
            deleteBtn.addEventListener("click", () => deleteNote(note.id));

            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.className = "edit-btn";
            editBtn.addEventListener("click", () => editNote(note.id));

            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);

            li.appendChild(title);
            li.appendChild(content);
            li.appendChild(actions);

            notesList.appendChild(li);
        });
    }

    function addNote() {
        const title = titleInput.value.trim();
        const content = noteInput.value.trim();

        if (!title || !content) {
            showMessage("Both fields are required.");
            return;
        }

        const newNote = {
            id: Date.now(),
            title,
            content
        };

        notes.push(newNote);
        saveNotes();
        renderNotes();

        titleInput.value = "";
        noteInput.value = "";

        showMessage("Note added successfully!", false);
    }

    function deleteNote(id) {
        notes = notes.filter(note => note.id !== id);
        saveNotes();
        renderNotes();
    }

    function editNote(id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;

        const newContent = prompt("Edit your note:", note.content);

        if (newContent === null) return;

        if (!newContent.trim()) {
            showMessage("Note cannot be empty.");
            return;
        }

        note.content = newContent.trim();
        saveNotes();
        renderNotes();
    }

    addNoteBtn.addEventListener("click", addNote);

    loadNotes();
    renderNotes();
</script>

</body>
</html>
