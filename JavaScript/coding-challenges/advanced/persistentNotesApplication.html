<!-- Problem 4: Persistent Notes Application
Objective
Build a notes application where data persists after refresh.

Requirements
Add, edit, and delete notes
Save notes to localStorage
Load notes on page load
Serialize and deserialize data using JSON.stringify / JSON.parse

Handle edge cases:
Empty storage
Corrupt or invalid stored data
Expected Outcome
Notes persist across refreshes
App does not crash with invalid storage data
Smooth user experience -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Application</title>
    <style>
        .input {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <h1>Your Notes</h1>
    <ul id="notes-list"></ul>
    <h2>Add New Note</h2>
    <div class="input">
        <div><input type="text" id="title" placeholder="Enter title" required></div>
        <div><textarea type="text" id="note-input" placeholder="Enter a new note"></textarea></div>
        <div><button id="add-note">Add Note</button></div>
    </div>
    <p id="show"></p>

    <script>

        const notesList = document.getElementById('notes-list');
        const titleInput = document.getElementById('title');
        const noteInput = document.getElementById('note-input');
        const addNote = document.getElementById('add-note');
        const show = document.getElementById('show');

        addNote.addEventListener("click", () => {
            if (titleInput.value === "" || noteInput.value === "") {
                show.textContent = "Please fill in both fields!";
                setTimeout(() => {
                    show.textContent = "";
                }, 2000);
                return;
            }
            localStorage.setItem(titleInput.value, noteInput.value)
            titleInput.value = "";
            noteInput.value = "";
            show.textContent = "Note added successfully!";
            setTimeout(() => {
                show.textContent = "";
            }, 2000);
            renderNotes(Object.keys(localStorage));
        })

        function renderNotes(notes) {
            notesList.innerHTML = notes
                .map(p => `
            <li><h3>${p}</h3><p>${localStorage.getItem(p)}</p></li>
            <button onclick="deleteNote('${p}')">Delete</button>
            <button onclick="editNote('${p}')">Edit</button>
            `)
                .join("")
        }

        function deleteNote(title) {
            localStorage.removeItem(title);
            renderNotes(Object.keys(localStorage));
        }

        function editNote(title) {
            const newNote = prompt("Edit your note:", localStorage.getItem(title));
            if (newNote !== null && newNote.trim() !== "") {
                localStorage.setItem(title, newNote);
                renderNotes(Object.keys(localStorage));
            }
            else {
                alert("Edit cancelled.");
            }
        }
        renderNotes(Object.keys(localStorage));
    </script>
</body>

</html>
